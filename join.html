<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Team</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css" />
    <style>
        :root {
            --primary: #3a5cbf;
            --primary-hover: #2c4794;
            --bg: #eff3f9;
            --card-bg: #ffffff;
            --text: #2c333f;
            --asterisk: #3b82f6;
            --border: #d8e0e9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .form-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 620px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        .form-group { margin-bottom: 28px; }
        
        label { display: block; font-size: 1rem; font-weight: 500; margin-bottom: 10px; color: var(--text); }
        label .required { color: var(--asterisk); margin-left: 3px; font-weight: 600; }
        
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            color: var(--text);
            background-color: #fff;
            transition: all 0.2s ease;
            outline: none;
        }
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(58, 92, 191, 0.15); }
        textarea { min-height: 140px; resize: vertical; }

        /* Match international input width matching */
        .iti { width: 100%; }
        .iti__light { background: #fff; }
        .iti input { padding-top: 14px; padding-bottom: 14px; }

        .submit-btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .submit-btn:hover { background-color: var(--primary-hover); }

        .loader-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(58, 92, 191, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { margin-top: 15px; color: var(--primary); font-weight: 500; font-size: 0.95rem; }

        .status-banner { display: none; padding: 14px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-weight: 500; }
        .success { display: block; background: #e6f7ed; color: #1e6b41; }
    </style>
</head>
<body>

<div class="form-card">
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
        <div class="loader-text">Registering internal profile...</div>
    </div>

    <div id="status" class="status-banner"></div>

    <form id="joinForm">
        <div class="form-group">
            <label>First name<span class="required">*</span></label>
            <input type="text" id="firstName" required>
        </div>

        <div class="form-group">
            <label>Last name<span class="required">*</span></label>
            <input type="text" id="lastName" required>
        </div>

        <div class="form-group">
            <label>Email<span class="required">*</span></label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label>Phone<span class="required">*</span></label>
            <input type="text" id="phone" required>
        </div>

        <div class="form-group">
            <label>Every act of kindness counts. How would you like to help?<span class="required">*</span></label>
            <textarea id="skillsInterests" required></textarea>
        </div>

        <button type="submit" class="submit-btn">Join Team</button>
    </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
<script>
    const URL = "https://script.google.com/macros/s/AKfycbw99ky6ehUTiahswg7wxGcNUb4FaRReTJAzjVz76q0adGsMEBWvq_Rj2BVny8pWZHh2/exec";
    
    // Initialize the flag engine with Kenya defaults
    const phoneInput = document.querySelector("#phone");
    const iti = window.intlTelInput(phoneInput, {
        initialCountry: "ke",
        separateDialCode: true,
        utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"
    });

    document.getElementById('joinForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const loader = document.getElementById('loader');
        const status = document.getElementById('status');
        
        loader.style.display = 'flex';
        status.className = 'status-banner';

        const dynamicFullNumber = iti.getNumber();

        try {
            await fetch(URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'join',
                    firstName: document.getElementById('firstName').value,
                    lastName: document.getElementById('lastName').value,
                    email: document.getElementById('email').value,
                    phone: dynamicFullNumber,
                    skillsInterests: document.getElementById('skillsInterests').value
                })
            });
            
            loader.style.display = 'none';
            status.innerText = "Application submitted successfully!";
            status.classList.add('success');
            e.target.reset();
        } catch (err) {
            loader.style.display = 'none';
            alert("Submission error. Please check connections.");
        }
    });
</script>
</body>
</html>
