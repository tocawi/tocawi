<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        :root {
            --primary: #3a5cbf;
            --primary-hover: #2c4794;
            --bg: #eff3f9;
            --card-bg: #ffffff;
            --text: #2c333f;
            --asterisk: #3b82f6;
            --border: #d8e0e9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .form-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 620px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        .form-group { margin-bottom: 28px; }
        
        label { display: block; font-size: 1rem; font-weight: 500; margin-bottom: 10px; color: var(--text); }
        label .required { color: var(--asterisk); margin-left: 3px; font-weight: 600; }
        
        input[type="text"], input[type="email"], textarea, input[type="file"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            color: var(--text);
            background-color: #fff;
            transition: all 0.2s ease;
            outline: none;
        }
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(58, 92, 191, 0.15); }
        textarea { min-height: 100px; resize: vertical; }

        #map { height: 240px; width: 100%; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 12px; z-index: 1; }
        .coordinate-panel { display: flex; gap: 12px; }
        .coordinate-panel input { background-color: #f4f6f9; color: #718096; cursor: not-allowed; }

        .submit-btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        .submit-btn:hover { background-color: var(--primary-hover); }

        .loader-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(58, 92, 191, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { margin-top: 15px; color: var(--primary); font-weight: 500; font-size: 0.95rem; }

        .status-banner { display: none; padding: 14px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-weight: 500; }
        .success { display: block; background: #e6f7ed; color: #1e6b41; }
    </style>
</head>
<body>

<div class="form-card">
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
        <div class="loader-text">Uploading report coordinates...</div>
    </div>

    <div id="status" class="status-banner"></div>

    <form id="reportForm">
        <div class="form-group">
            <label>Reporter Name<span class="required">*</span></label>
            <input type="text" id="reportName" required placeholder="e.g. Doe / Stray animal incident">
        </div>

        <div class="form-group">
            <label>Email address<span class="required">*</span></label>
            <input type="email" id="email" required placeholder="e.g. doe@example.com">
        </div>

        <div class="form-group">
            <label>Description of Incident<span class="required">*</span></label>
            <textarea id="description" required placeholder="Provide situational context details..."></textarea>
        </div>

        <div class="form-group">
            <label>Photo Attachment</label>
            <input type="file" id="photo" accept="image/*">
        </div>

        <div class="form-group">
            <label>Search or Place Location Pin<span class="required">*</span></label>
            <div id="map"></div>
            <div class="coordinate-panel">
                <input type="text" id="lat" placeholder="Latitude" readonly required>
                <input type="text" id="lng" placeholder="Longitude" readonly required>
            </div>
        </div>

        <button type="submit" class="submit-btn">Submit Incident Report</button>
    </form>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    const URL = "https://script.google.com/macros/s/AKfycbw99ky6ehUTiahswg7wxGcNUb4FaRReTJAzjVz76q0adGsMEBWvq_Rj2BVny8pWZHh2/exec";
    
    let map, mapMarker;
    let base64ImageString = "";

    // Map configuration setup defaulting center directly over Kiambu region bounds
    function initReportingMap() {
        map = L.map('map').setView([-1.25, 36.71], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        map.on('click', (e) => {
            const latitude = e.latlng.lat;
            const longitude = e.latlng.lng;

            if (mapMarker) {
                mapMarker.setLatLng(e.latlng);
            } else {
                mapMarker = L.marker(e.latlng).addTo(map);
            }

            document.getElementById('lat').value = latitude.toFixed(6);
            document.getElementById('lng').value = longitude.toFixed(6);
        });
    }
    
    window.onload = initReportingMap;

    // Fast Canvas engine file compressor to avoid memory exceptions within downstream Sheet storage
    document.getElementById('photo').addEventListener('change', (e) => {
        const selectedFile = e.target.files[0];
        if (!selectedFile) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const coreImg = new Image();
            coreImg.onload = () => {
                const targetCanvas = document.createElement('canvas');
                const boundWidth = 600;
                const dynamicScale = boundWidth / coreImg.width;
                targetCanvas.width = boundWidth;
                targetCanvas.height = coreImg.height * dynamicScale;
                
                const context2d = targetCanvas.getContext('2d');
                context2d.drawImage(coreImg, 0, 0, targetCanvas.width, targetCanvas.height);
                base64ImageString = targetCanvas.toDataURL('image/jpeg', 0.6);
            }
            coreImg.src = event.target.result;
        }
        reader.readAsDataURL(selectedFile);
    });

    document.getElementById('reportForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const loader = document.getElementById('loader');
        const status = document.getElementById('status');
        
        loader.style.display = 'flex';
        status.className = 'status-banner';

        try {
            await fetch(URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'report',
                    name: document.getElementById('reportName').value,
                    email: document.getElementById('email').value,
                    description: document.getElementById('description').value,
                    photo: base64ImageString,
                    lat: document.getElementById('lat').value,
                    lng: document.getElementById('lng').value
                })
            });
            
            loader.style.display = 'none';
            status.innerText = "Critical alert logged successfully.";
            status.classList.add('success');
            e.target.reset();
            
            if (mapMarker) {
                map.removeLayer(mapMarker);
                mapMarker = null;
            }
            base64ImageString = "";
        } catch (err) {
            loader.style.display = 'none';
            alert("Communication breakdown error.");
        }
    });
</script>
</body>
</html>
