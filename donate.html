<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3a5cbf;
            --primary-hover: #2c4794;
            --bg: #eff3f9;
            --card-bg: #ffffff;
            --text: #2c333f;
            --asterisk: #3b82f6;
            --border: #d8e0e9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .form-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 620px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        .form-group { margin-bottom: 28px; }
        
        label { display: block; font-size: 1rem; font-weight: 500; margin-bottom: 10px; color: var(--text); }
        label .required { color: var(--asterisk); margin-left: 3px; font-weight: 600; }
        
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            color: var(--text);
            background-color: #fff;
            transition: all 0.2s ease;
            outline: none;
        }
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(58, 92, 191, 0.15); }
        textarea { min-height: 120px; resize: vertical; }

        /* Country Code Selector Styling */
        .phone-input-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: #fff;
            transition: all 0.2s ease;
            overflow: hidden;
        }
        .phone-input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(58, 92, 191, 0.15);
        }
        .phone-prefix {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 16px;
            background-color: #f1f3f5;
            border-right: 1px solid var(--border);
            color: var(--text);
            font-size: 1rem;
            font-weight: 500;
            user-select: none;
        }
        .phone-prefix svg {
            display: block;
            border-radius: 2px;
        }
        .phone-prefix .arrow {
            font-size: 0.75rem;
            color: #718096;
            margin-left: 2px;
        }
        /* Override standard text styles for phone input inside wrapper */
        .phone-input-wrapper input[type="text"] {
            border: none !important;
            border-radius: 0 !important;
            padding: 14px 16px !important;
            margin: 0 !important;
            flex: 1;
            background-color: transparent !important;
            width: 100%;
        }
        .phone-input-wrapper input[type="text"]:focus {
            box-shadow: none !important;
            border-color: transparent !important;
        }

        .submit-btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .submit-btn:hover { background-color: var(--primary-hover); }

        /* Creative Overlay Loading Bar UI */
        .loader-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(58, 92, 191, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { margin-top: 15px; color: var(--primary); font-weight: 500; font-size: 0.95rem; }

        .status-banner { display: none; padding: 14px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-weight: 500; }
        .success { display: block; background: #e6f7ed; color: #1e6b41; }
    </style>
</head>
<body>

<div class="form-card">
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
        <div class="loader-text">Uploading donation data...</div>
    </div>

    <div id="status" class="status-banner"></div>

    <form id="donateForm">
        <div class="form-group">
            <label>Full name<span class="required">*</span></label>
            <input type="text" id="name" required placeholder="e.g. Jane Doe">
        </div>

        <div class="form-group">
            <label>Phone<span class="required">*</span></label>
            <div class="phone-input-wrapper">
                <div class="phone-prefix">
                    <!-- Kenya Flag SVG -->
                    <svg class="flag-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 24" width="24" height="16">
                        <rect width="36" height="24" fill="#008C51"/>
                        <rect width="36" height="16" fill="#BB0A30"/>
                        <rect width="36" height="8" fill="#000000"/>
                        <rect y="7.2" width="36" height="1.6" fill="#FFFFFF"/>
                        <rect y="15.2" width="36" height="1.6" fill="#FFFFFF"/>
                        <!-- Crossed Spears -->
                        <path d="M 13,19 L 23,5 M 23,19 L 13,5" stroke="#FFFFFF" stroke-width="1.2"/>
                        <!-- Shield -->
                        <path d="M 18,4 C 21,8 21,16 18,20 C 15,16 15,8 18,4 Z" fill="#000000"/>
                        <path d="M 18,5 C 20,8 20,16 18,19 C 16,16 16,8 18,5 Z" fill="#BB0A30"/>
                        <circle cx="18" cy="12" r="1" fill="#FFFFFF"/>
                        <path d="M 18,8 L 18,16" stroke="#FFFFFF" stroke-width="1"/>
                    </svg>
                    <span>+254</span>
                    <span class="arrow">▼</span>
                </div>
                <input type="text" id="phone" required placeholder="712 123456">
            </div>
        </div>

        <div class="form-group">
            <label>Amount<span class="required">*</span></label>
            <input type="text" id="amount" required placeholder="e.g. 50.00">
        </div>

        <div class="form-group">
            <label>Email address<span class="required">*</span></label>
            <input type="email" id="email" required placeholder="e.g. jane@example.com">
        </div>

        <div class="form-group">
            <label>Payment Message / Transaction Reference to Account 0987654321<span class="required">*</span></label>
            <textarea id="paymentMessage" required placeholder="Please paste your mobile money (e.g., M-Pesa) or bank transaction confirmation sequence here..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit Donation</button>
    </form>
</div>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbzn84uYSFZC1mhsTQsi93Qzq7ahCmFl47K5JPacEv4h3x2h2koyKSXLlhhnq9XA_nyB/exec";
    
    document.getElementById('donateForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const loader = document.getElementById('loader');
        const status = document.getElementById('status');
        
        loader.style.display = 'flex';
        status.className = 'status-banner';

        // Read dynamic phone input value and format correctly with +254 prefix
        let rawPhone = document.getElementById('phone').value.trim();
        let formattedPhone = rawPhone;
        if (!rawPhone.startsWith('+') && !rawPhone.startsWith('254')) {
            formattedPhone = '+254 ' + rawPhone;
        }

        try {
            await fetch(URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'donate',
                    name: document.getElementById('name').value,
                    phone: formattedPhone,
                    amount: document.getElementById('amount').value,
                    email: document.getElementById('email').value,
                    paymentMessage: document.getElementById('paymentMessage').value
                })
            });
            
            loader.style.display = 'none';
            status.innerText = "Donation recorded successfully! Thank you.";
            status.classList.add('success');
            e.target.reset();
        } catch (err) {
            loader.style.display = 'none';
            alert("Error sending request. Please check connections.");
        }
    });
</script>
</body>
</html>
